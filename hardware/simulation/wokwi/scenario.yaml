name: 'HARMONIA RP2350 2x2 Matrix Validation'
version: 1
author: 'HARMONIA Project'
steps:
  # ==========================================
  # Teste A - Inicializacao e Heartbeat
  # ==========================================
  - wait-serial: '[BOOT] HARMONIA RP2350'
  - wait-serial: '[GPIO] Rows: GP10, GP11 (Hi-Z / active-low) | Cols: GP14, GP15 (pull-up)'
  - wait-serial: '[SCAN] Interval: 1000 us | Debounce: 20000 us | Notes: 60..63 | Vel: 40000'
  - wait-serial: '[HEARTBEAT]'

  # ==========================================
  # Teste B - Teclas individuais (K1..K4)
  # ==========================================
  - set-control: { part-id: k1, name: pressed, value: 1 }
  - wait-serial: 'ch=0 note=60 vel=40000'
  - set-control: { part-id: k1, name: pressed, value: 0 }
  - wait-serial: 'ch=0 note=60 vel=0'

  - set-control: { part-id: k2, name: pressed, value: 1 }
  - wait-serial: 'ch=0 note=61 vel=40000'
  - set-control: { part-id: k2, name: pressed, value: 0 }
  - wait-serial: 'ch=0 note=61 vel=0'

  - set-control: { part-id: k3, name: pressed, value: 1 }
  - wait-serial: 'ch=0 note=62 vel=40000'
  - set-control: { part-id: k3, name: pressed, value: 0 }
  - wait-serial: 'ch=0 note=62 vel=0'

  - set-control: { part-id: k4, name: pressed, value: 1 }
  - wait-serial: 'ch=0 note=63 vel=40000'
  - set-control: { part-id: k4, name: pressed, value: 0 }
  - wait-serial: 'ch=0 note=63 vel=0'

  # ==========================================
  # Teste C - Acordes de 2 teclas (ordem livre validada por fase no verify_wokwi_log.py)
  # ==========================================
  # K1 + K2
  - set-control: { part-id: k1, name: pressed, value: 1 }
  - delay: 2ms
  - set-control: { part-id: k2, name: pressed, value: 1 }
  - delay: 45ms
  - set-control: { part-id: k1, name: pressed, value: 0 }
  - delay: 2ms
  - set-control: { part-id: k2, name: pressed, value: 0 }
  - delay: 45ms

  # K1 + K3
  - set-control: { part-id: k1, name: pressed, value: 1 }
  - delay: 2ms
  - set-control: { part-id: k3, name: pressed, value: 1 }
  - delay: 45ms
  - set-control: { part-id: k1, name: pressed, value: 0 }
  - delay: 2ms
  - set-control: { part-id: k3, name: pressed, value: 0 }
  - delay: 45ms

  # K2 + K4
  - set-control: { part-id: k2, name: pressed, value: 1 }
  - delay: 2ms
  - set-control: { part-id: k4, name: pressed, value: 1 }
  - delay: 45ms
  - set-control: { part-id: k2, name: pressed, value: 0 }
  - delay: 2ms
  - set-control: { part-id: k4, name: pressed, value: 0 }
  - delay: 45ms

  # ==========================================
  # Teste D - 3 vertices (K1+K2+K3 isolado)
  # ==========================================
  - set-control: { part-id: k1, name: pressed, value: 1 }
  - delay: 2ms
  - set-control: { part-id: k2, name: pressed, value: 1 }
  - delay: 2ms
  - set-control: { part-id: k3, name: pressed, value: 1 }
  - delay: 45ms
  - set-control: { part-id: k1, name: pressed, value: 0 }
  - delay: 2ms
  - set-control: { part-id: k2, name: pressed, value: 0 }
  - delay: 2ms
  - set-control: { part-id: k3, name: pressed, value: 0 }
  - delay: 45ms

  # ==========================================
  # Teste D2 - 4 teclas simultaneas (K1+K2+K3+K4)
  # ==========================================
  - set-control: { part-id: k1, name: pressed, value: 1 }
  - delay: 2ms
  - set-control: { part-id: k2, name: pressed, value: 1 }
  - delay: 2ms
  - set-control: { part-id: k3, name: pressed, value: 1 }
  - delay: 2ms
  - set-control: { part-id: k4, name: pressed, value: 1 }
  - delay: 45ms
  - set-control: { part-id: k1, name: pressed, value: 0 }
  - delay: 2ms
  - set-control: { part-id: k2, name: pressed, value: 0 }
  - delay: 2ms
  - set-control: { part-id: k3, name: pressed, value: 0 }
  - delay: 2ms
  - set-control: { part-id: k4, name: pressed, value: 0 }
  - delay: 45ms

  # ==========================================
  # Teste E - Estabilidade (pressionamento prolongado)
  # ==========================================
  - set-control: { part-id: k1, name: pressed, value: 1 }
  - wait-serial: 'ch=0 note=60 vel=40000'
  - delay: 250ms
  - set-control: { part-id: k1, name: pressed, value: 0 }
  - wait-serial: 'ch=0 note=60 vel=0'
